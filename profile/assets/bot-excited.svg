<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -8 140 132" width="280" height="264" role="img" aria-label="Excited pose: big happy eyes, rocking side to side with motion lines" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.fb{transform-box:fill-box;transform-origin:center}.vb{transform-box:view-box;transform-origin:60px 94px}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}.blink{animation:blink 3.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes rock{0%,100%{transform:rotate(0deg)}20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}.rock{animation:rock 1.6s ease-in-out infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.bounce{animation:bounce .4s ease-in-out infinite}@keyframes lines{0%,100%{opacity:.35}50%{opacity:1}}.lines{animation:lines .8s ease-in-out infinite}@keyframes twinkle{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.35) rotate(45deg)}}.twinkle{animation:twinkle 1.4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}}.tilt{animation:tilt 2.4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(1.6px)}}.breathe{animation:breathe 3.2s ease-in-out infinite}@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(4px,-6px)}}.zz1{animation:zz 2.4s ease-out infinite}.zz2{animation:zz 2.4s ease-out .8s infinite}@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}.sway{animation:sway 2.2s ease-in-out infinite}@keyframes boot{0%,100%{opacity:.3}50%{opacity:1}}.boot{animation:boot 1.2s ease-in-out infinite}@keyframes cursor{0%,50%{opacity:1}51%,100%{opacity:0}}.cursor{animation:cursor 1s steps(1) infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}.nudge{animation:nudge 1s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}.pulse{animation:pulse 1s ease-in-out infinite}@keyframes look{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}.look{animation:look 2.4s ease-in-out infinite}@keyframes pop{0%{opacity:0;transform:scale(.4)}20%,80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}.pop1{animation:pop 2.4s ease-out infinite}.pop2{animation:pop 2.4s ease-out .3s infinite}.pop3{animation:pop 2.4s ease-out .6s infinite}@keyframes bang{0%,100%{transform:scale(1) rotate(0deg)}10%{transform:scale(1.3) rotate(-8deg)}20%{transform:scale(1) rotate(8deg)}30%{transform:scale(1) rotate(0deg)}}.bang{animation:bang 1.6s ease-in-out infinite}@keyframes jump{0%,100%{transform:translateY(0)}15%{transform:translateY(-4px)}30%{transform:translateY(0)}}.jump{animation:jump 1.6s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}.scan{animation:scan 1.8s ease-in-out infinite}.float{animation:bob 2s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0)}20%{transform:translateY(-5px)}40%{transform:translateY(0)}}.hop{animation:hop 1.2s ease-out infinite}@keyframes confetti{0%{opacity:0;transform:translateY(-4px)}20%{opacity:1}100%{opacity:0;transform:translateY(8px)}}.conf1{animation:confetti 1.2s ease-in infinite}.conf2{animation:confetti 1.2s ease-in .4s infinite}.conf3{animation:confetti 1.2s ease-in .8s infinite}@keyframes drip{0%{opacity:0;transform:translateY(-4px)}20%{opacity:1}80%{opacity:1;transform:translateY(8px)}100%{opacity:0;transform:translateY(10px)}}.drip{animation:drip 2s ease-in infinite}@keyframes droop{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}.droop{animation:droop 3s ease-in-out infinite}@keyframes slowblink{0%,85%,100%{transform:scaleY(1)}92%{transform:scaleY(.2)}}.slowblink{animation:slowblink 4s ease-in-out infinite}@keyframes steam{0%,100%{opacity:.25}50%{opacity:.6}}.steam{animation:steam 2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><path class="lines" d="M7 46 Q1 58 7 70 M-1 42 Q-8 58 -1 74 M113 46 Q119 58 113 70 M121 42 Q128 58 121 74" fill="none" stroke="#4F6BFF" stroke-width="2.6" stroke-linecap="round"></path><g class="vb rock"><line x1="60" y1="28" x2="60" y2="13" stroke="#1E1E24" stroke-width="5" stroke-linecap="round"></line><circle class="bounce" cx="60" cy="9" r="6" fill="#4F6BFF"></circle><rect x="15" y="52" width="9" height="20" rx="3" fill="#1E1E24"></rect><rect x="96" y="52" width="9" height="20" rx="3" fill="#1E1E24"></rect><rect x="22" y="28" width="76" height="66" rx="20" fill="#1E1E24"></rect><rect x="32" y="42" width="56" height="36" rx="14" fill="#F5F0E6"></rect><g transform="rotate(35 86 32)"><rect x="68" y="24" width="36" height="16" rx="4" fill="#4F6BFF"></rect><rect x="71.5" y="27.5" width="29" height="9" rx="2" fill="none" stroke="#F5F0E6" stroke-width="1.6" stroke-dasharray="3 2.2"></rect></g><path d="M42 66 Q49 53 56 66 M64 66 Q71 53 78 66" fill="none" stroke="#1E1E24" stroke-width="5" stroke-linecap="round"></path></g></svg>
